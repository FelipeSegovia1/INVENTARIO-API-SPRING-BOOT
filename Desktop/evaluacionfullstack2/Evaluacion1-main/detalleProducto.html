<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .producto-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .breadcrumb-item a {
        color: #000 !important;     /* negro */
        font-weight: 600;           /* semi-bold */
        text-decoration: none;      /* quita el subrayado */
    }

        .breadcrumb-item.active {
        color: #000 !important;     /* negro también el activo */
        font-weight: 700;           /* más gordita (bold) */
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="container-fluid p-0">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
          <img src="img/iconmonstr-menu-4.png" alt="Menu" style="width: 30px; height: 30px;">
        </button>
        
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
          <ul class="navbar-nav d-flex align-items-center">
            <span class="navbar-text me-3" style="font-size: 20px;">Bella sin culpa</span>
            <li class="nav-item"><a class="nav-link" href="plantillabootstrap.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contactanos.html">Contactanos</a></li>
            <li class="nav-item"><a class="nav-link" href="https://www.instagram.com/bella.sinculpa/" target="_blank">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="ropa.html">Productos</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </div>

  <!-- Breadcrumb -->
  <div class="container my-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="plantillabootstrap.html">Home</a></li>
        <li class="breadcrumb-item"><a href="ropa.html">Productos</a></li>
        <li class="breadcrumb-item active" id="breadcrumb-producto" aria-current="page">Detalle</li>
      </ol>
    </nav>
  </div>

  <!-- DETALLE PRODUCTO -->
  <div class="container producto-container my-4">
    <div class="row">
      <!-- Imagen principal -->
      <div class="col-md-6 text-center">
        <img id="imagen" class="img-fluid mb-3" style="max-width: 400px;">
        <!-- Galería fotos relacionadas -->
        <div id="galeria" class="d-flex justify-content-center gap-2"></div>
      </div>

      <!-- Info producto -->
      <div class="col-md-6">
        <h1 id="nombre" class="mb-4"></h1>
        <p><strong>Precio:</strong> $<span id="precio"></span></p>
        <p><strong>Descripción:</strong> <span id="descripcion"></span></p>

        <!-- Cantidad y botón -->
        <div class="d-flex align-items-center my-3">
          <label for="cantidad" class="me-2"><strong>Cantidad:</strong></label>
          <input type="number" id="cantidad" class="form-control w-25 me-3" min="1" value="1">
          <button id="btnCarrito" class="btn btn-primary">
            <i class="bi bi-cart-plus"></i> Agregar al carrito
          </button>
        </div>

        <a href="ropa.html" class="btn btn-secondary mt-3">Volver a la lista</a>
      </div>
    </div>
  </div>

  <!-- Productos relacionados -->
  <div class="container my-5">
    <h3 class="mb-4">Productos relacionados</h3>
    <div class="row" id="relacionados">
      <!-- Se mostrarán 3 productos ficticios -->
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    fetch(`http://localhost:3000/productos/${id}`)
      .then(res => res.json())
      .then(producto => {
        // Mostrar datos
        document.getElementById("nombre").textContent = producto.nombre;
        document.getElementById("imagen").src = producto.foto;
        document.getElementById("precio").textContent = producto.precio;
        document.getElementById("descripcion").textContent = producto.descripcion;
        document.getElementById("breadcrumb-producto").textContent = producto.nombre;

        // Galería de fotos relacionadas
        if (producto.fotosRelacionadas && producto.fotosRelacionadas.length > 0) {
          const galeria = document.getElementById("galeria");
          producto.fotosRelacionadas.forEach(foto => {
            const img = document.createElement("img");
            img.src = foto;
            img.style.width = "80px";
            img.style.cursor = "pointer";
            img.classList.add("img-thumbnail");
            img.addEventListener("click", () => {
              document.getElementById("imagen").src = foto;
            });
            galeria.appendChild(img);
          });
        }

        // Botón agregar al carrito
        document.getElementById("btnCarrito").addEventListener("click", () => {
          const cantidad = parseInt(document.getElementById("cantidad").value);
          let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

          const index = carrito.findIndex(item => item.id === producto.id);
          if (index >= 0) {
            carrito[index].cantidad += cantidad;
          } else {
            carrito.push({ ...producto, cantidad });
          }

          localStorage.setItem("carrito", JSON.stringify(carrito));
          window.location.href = "carrito.html"; // redirige al carrito
        });

        // Productos relacionados (ilusión)
        const relacionados = document.getElementById("relacionados");
        for (let i = 1; i <= 3; i++) {
          relacionados.innerHTML += `
            <div class="col-md-4">
              <div class="card mb-4 shadow-sm">
                <img src="img/producto${i}.png" class="card-img-top" alt="Producto relacionado ${i}">
                <div class="card-body text-center">
                  <h5 class="card-title">Producto ${i}</h5>
                  <p class="card-text">$${(i*2000).toLocaleString()}</p>
                  <a href="detalleProducto.html?id=${i}" class="btn btn-outline-dark btn-sm">Ver detalle</a>
                </div>
              </div>
            </div>
          `;
        }
      })
      .catch(err => console.error("Error al cargar producto:", err));
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
