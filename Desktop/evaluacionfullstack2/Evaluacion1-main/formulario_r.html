        <div class="">
        <form action="" method="post" id="registro" class="formulario-fondo p-4 rounded">
            <h3 class="titulo text-center mb-4">Formulario de Registro</h3>

            <div class="form-group caja">
            <label for="nom" class="form-label etiqueta">Nombre completo:</label>
            <input type="text" class="form-control" id="nom" required placeholder="ejemplo perez">
            </div>

            <div class="form-group caja">
            <label for="correo" class="form-label etiqueta">Correo Usuario:</label>
            <input type="email" class="form-control" id="correo" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="form-group caja">
            <label for="correo2" class="form-label etiqueta">Confirmar correo:</label>
            <input type="email" class="form-control" id="correo2" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="form-group caja">
            <label for="pass" class="form-label etiqueta">Contraseña de usuario:</label>
            <input type="password" id="pass" name="pass" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
            </div>

            <div class="form-group caja">
            <label for="pass2" class="form-label etiqueta">Confirmar Contraseña :</label>
            <input type="password" id="pass2" name="pass2" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
            </div>

            <!-- Región y comuna -->
            <div class="d-flex gap-2 mt-3" id="comuna-region">
            <select id="region" class="form-select">
                <option value="0">Seleccione región...</option>
                <option value="rm">Región Metropolitana</option>
                <option value="valpo">Valparaíso</option>
                <option value="bio">Biobío</option>
            </select>

            <select id="comuna" class="form-select">
                <option value="0">Seleccione comuna...</option>
            </select>
            </div>

            <script>
            // Diccionario Región → Comunas
            const comunasPorRegion = {
                rm: ["Maipú", "Cerrillos", "Pudahuel", "Padre Hurtado", "Las Condes"],
                valpo: ["Valparaíso", "Viña del Mar", "Concón", "Quilpué", "Villa Alemana"],
                bio: ["Concepción", "Talcahuano", "Los Ángeles", "Coronel", "Chillán"]
            };

            const regionSelect = document.getElementById("region");
            const comunaSelect = document.getElementById("comuna");

            // Evento: cuando cambia la región
            regionSelect.addEventListener("change", function() {
                const region = this.value;

                // Limpiar opciones anteriores
                comunaSelect.innerHTML = '<option value="0">Seleccione comuna...</option>';

                if (comunasPorRegion[region]) {
                comunasPorRegion[region].forEach((comuna, index) => {
                    const option = document.createElement("option");
                    option.value = index + 1; // puedes cambiar el value a tu gusto
                    option.textContent = comuna;
                    comunaSelect.appendChild(option);
                });
                }
            });
            </script>

            <!-- Checkbox -->
            <div class="form-check mt-3 caja">
            <input type="checkbox" class="form-check-input" id="acepta" name="acepta" value="si">
            <label for="acepta" class="form-check-label etiqueta">Acepta las condiciones</label>
            </div>

            <!-- Botón -->
            <div class="text-center mt-4">
            <button type="submit" class="btn btn-success me-2" style="background: linear-gradient(90deg, #ae1eca 60%, #9e1f89 100%); color: #fff; font-weight: bold; box-shadow: 0 2px 6px rgba(40,167,69,0.2); border: none;">
                Enviar datos
            </button>
            </div>

        </form>
