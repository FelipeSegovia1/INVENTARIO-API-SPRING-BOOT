    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
fetch("http://localhost:3000/productos")
  .then(res => res.json())
  .then(productos => {
    const contenedor = document.getElementById("productos-home");
    contenedor.innerHTML = "";

    // Mostrar solo 6 productos
    productos.slice(0, 6).forEach(prod => {
      contenedor.innerHTML += `
        <div class="col-md-4 mb-5">
          <div class="card h-100 text-center" 
               style="cursor:pointer;" 
               onclick="window.location.href='detalleProducto.html?id=${prod.id}'">
            <img class="card-img-top" src="${prod.foto}" alt="${prod.nombre}">
            <div class="card-body">
              <h4 class="card-title">${prod.nombre}</h4>
              <p class="card-text">$${prod.precio}</p>
            </div>
          </div>
        </div>
      `;
    });
  })
  .catch(err => console.error("Error al cargar productos:", err));
</script>
